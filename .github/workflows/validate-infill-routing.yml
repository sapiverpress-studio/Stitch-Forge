name: MD-2.55 source-preserving infill native validation

on:
  push:
    branches: ["feature/researched-infill-consolidation-md255", "feature/beta-running-compaction-md256", "feature/fill-preserving-native-repair-md257", "feature/source-aware-scanline-engine-md258", "feature/hybrid-geometry-routing-md259", "feature/tatami-coverage-decomposition-md260", "feature/automatic-multi-method-release-candidate-md261", "feature/source-detail-safe-running-router-md262", "feature/native-routing-ab-release-gate-md263", "feature/visible-artwork-sizing-underlay-audit-md264"]
    paths:
      - "services/digitiser/artwork_trial.py"
      - "site/artwork-pipeline.js"
      - "site/auto-reconstruct-ui.js"
      - "tests/test_artwork_pipeline.cjs"
      - "services/digitiser/source_scanline_fill.py"
      - "services/digitiser/geometry_intelligence.py"
      - "services/digitiser/native_tatami_decomposition.py"
      - "services/digitiser/repair_policy.py"
      - "services/digitiser/native_detail_routing.py"
      - "services/digitiser/artwork_service.py"
      - "services/digitiser/running_compaction.py"
      - "tests/test_running_compaction.py"
      - "tools/staged_md255_kingfisher.py"
      - "tools/run_md256_staged_benchmark.sh"
      - "tools/run_md257_staged_benchmark.sh"
      - "tests/test_artwork_trial.py"
      - "tests/test_native_detail_routing.py"
      - "tools/bench_native_detail_routing_ab.py"
      - "tests/test_native_routing_ab.py"
      - "tests/test_source_scanline_fill.py"
      - "tests/test_geometry_intelligence.py"
      - "tests/test_native_tatami_decomposition.py"
      - "tests/test_artwork_service.py"
      - "tools/run_artwork_trial.py"
      - ".github/workflows/validate-infill-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inkstitch-pyembroidery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Cloud Run private-only deploy script (NO GCP writes)
        shell: bash
        run: |
          set -euo pipefail
          bash -n services/digitiser/deploy-cloud-run-staging.sh
          export GOOGLE_CLOUD_PROJECT=stitch-forge-test CLOUD_RUN_REGION=europe-west2
          export CLOUD_RUN_REPOSITORY=stitch-forge-staging STITCH_FORGE_CLOUD_SECRET=worker-token
          export CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT=worker@test-project.iam.gserviceaccount.com
          export STITCH_FORGE_DEPLOY_COMMIT=0123456789abcdef0123456789abcdef01234567
          bash services/digitiser/deploy-cloud-run-staging.sh > "$RUNNER_TEMP/cloud-plan.txt"
          grep -F -- '--no-allow-unauthenticated' "$RUNNER_TEMP/cloud-plan.txt"
          grep -F -- 'DRY RUN ONLY' "$RUNNER_TEMP/cloud-plan.txt"
          if grep -F -- '--allow-unauthenticated ' "$RUNNER_TEMP/cloud-plan.txt"; then
            echo 'Cloud Run staging MUST NOT be public'; exit 1
          fi
          if bash services/digitiser/deploy-cloud-run-staging.sh --execute > "$RUNNER_TEMP/cloud-refusal.txt" 2>&1; then
            echo 'Cloud Run deployed without explicit charge approval'; exit 1
          fi
          grep -F -- 'REFUSED' "$RUNNER_TEMP/cloud-refusal.txt"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check protected MD-2.56 Cloud Shell script syntax (NO GCP writes)
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/run_md256_staged_benchmark.sh
          bash -n tools/run_md257_staged_benchmark.sh
          python -m py_compile tools/staged_md255_kingfisher.py
          python -m unittest discover -s tests -p 'test_staged_kingfisher_helper.py' -v
          grep -F -- '--no-traffic' tools/run_md256_staged_benchmark.sh
          grep -F -- 'EXPECTED_ORIGINAL=' tools/run_md256_staged_benchmark.sh
          grep -F -- '--no-traffic' tools/run_md257_staged_benchmark.sh
          grep -F -- 'STITCH_FORGE_MD257_BILLING_APPROVED' tools/run_md257_staged_benchmark.sh
          grep -F -- '--preflight' tools/run_md257_staged_benchmark.sh
          grep -F -- 'STITCH_FORGE_BETA_COMPACT_RUNNING=1' tools/run_md256_staged_benchmark.sh
      - name: Install pyembroidery and Inkscape
        run: |
          python -m pip install pyembroidery==1.5.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape libnsl2 libwayland-server0 xvfb xauth
      - name: Run release selector and independent reader tests
        env:
          PYTHONPATH: services/digitiser
        run: |
          python -m unittest discover -s tests -p 'test_release_asset.py' -v
          python -m unittest discover -s tests -p 'test_format_audit.py' -v
      - name: Resolve exact official x86_64 archive
        env:
          PYTHONPATH: services/digitiser
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 'https://api.github.com/repos/inkstitch/inkstitch/releases/tags/v3.3.0' > "$RUNNER_TEMP/inkstitch-release.json"
          python - <<'PY'
          import os
          from pathlib import Path
          from release_asset import select_linux_x64_asset
          r = Path(os.environ['RUNNER_TEMP'])
          name, url, digest = select_linux_x64_asset((r / 'inkstitch-release.json').read_bytes())
          (r / 'asset-url').write_text(url)
          (r / 'expected-digest').write_text(digest or '')
          print('Official upstream file:', name)
          print('Upstream SHA-256 metadata:', 'present' if digest else 'missing — record observed hash only')
          PY
      - name: Download and safely extract official engine
        env:
          PYTHONPATH: services/digitiser
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 360 "$(cat "$RUNNER_TEMP/asset-url")" -o "$RUNNER_TEMP/inkstitch.tar.xz"
          sha256sum "$RUNNER_TEMP/inkstitch.tar.xz"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from release_asset import extract_verified_release
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'inkstitch.tar.xz'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = (root / 'expected-digest').read_text().strip()
          if expected and expected != actual:
              raise SystemExit('Upstream digest verification FAILED')
          if not expected:
              print('WARNING: no upstream digest; release tag pinned, asset digest not yet pinned')
          extract_verified_release(archive, root / 'inkstitch-unpacked')
          PY
          find "$RUNNER_TEMP/inkstitch-unpacked" -name inkstitch -type f -perm /111 -print > "$RUNNER_TEMP/inkstitch-executables"
          cat "$RUNNER_TEMP/inkstitch-executables"
          test "$(wc -l < "$RUNNER_TEMP/inkstitch-executables")" -eq 1
          echo "ENGINE_PATH=$(cat "$RUNNER_TEMP/inkstitch-executables")" >> "$GITHUB_ENV"
      - name: Verify signed foreground-fit sizing through the browser code
        run: |
          node --check site/artwork-pipeline.js
          node --check site/auto-reconstruct-ui.js
          node --test tests/test_artwork_pipeline.cjs
      - name: Validate shape routing and selective underlay with actual Ink/Stitch 3.3.0
        env:
          STITCH_FORGE_INKSTITCH: ${{ env.ENGINE_PATH }}
          QT_QPA_PLATFORM: xcb
        run: |
          python -m pip install -r services/digitiser/requirements-artwork-trial.txt
          xvfb-run -a -s "-screen 0 1280x800x24" python -m unittest discover -s tests -p test_artwork_trial.py -v
          xvfb-run -a -s "-screen 0 1280x800x24" python -m unittest discover -s tests -p test_artwork_service.py -v
          python -m unittest discover -s tests -p test_running_compaction.py -v
          python -m unittest discover -s tests -p test_source_scanline_fill.py -v
          python -m unittest discover -s tests -p test_geometry_intelligence.py -v
          python -m unittest discover -s tests -p test_native_tatami_decomposition.py -v
          python -m unittest discover -s tests -p test_native_detail_routing.py -v
          python -m unittest discover -s tests -p test_native_routing_ab.py -v
          STITCH_FORGE_SOURCE_SCANLINE_REPAIR=1 xvfb-run -a -s "-screen 0 1280x800x24" python -m unittest discover -s tests -p test_artwork_service.py -v
          STITCH_FORGE_BETA_COMPACT_RUNNING=1 xvfb-run -a -s "-screen 0 1280x800x24" python -m unittest discover -s tests -p test_artwork_service.py -v
      - name: Generate PES/DST from actual Ink/Stitch and read back independently
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" python services/digitiser/real_engine_smoke.py --inkstitch "$ENGINE_PATH" --output "$RUNNER_TEMP/engine-smoke.zip"
          unzip -t "$RUNNER_TEMP/engine-smoke.zip"
          xvfb-run -a -s "-screen 0 1280x800x24" python services/digitiser/real_engine_smoke.py --inkstitch "$ENGINE_PATH" --project tests/fixtures/browser_project_v03.json --output "$RUNNER_TEMP/browser-project-smoke.zip"
          unzip -t "$RUNNER_TEMP/browser-project-smoke.zip"
          # Exercise the exact JSON geometry -> trusted SVG -> real Ink/Stitch
          # -> separately decoded PES/DST transaction that the worker invokes.
          xvfb-run -a -s "-screen 0 1280x800x24" python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'services/digitiser')
          from machine_job import run_machine_job
          p = {'width': 65, 'hoop': 150,
               'paths': [
                 [[120,100],[260,100],[260,230],[120,230],[120,100]],
                 [[180,230],[180,320]]],
               'pathStyles':['tatami','running'],
               'pathColors':['#AA3344','#267C5C'],
               'pathSettings':[{'fillAngleDeg':30,'rowSpacingMm':0.55,
                                'fillUnderlay':True},
                               {'runningLengthMm':2.0}]}
          result = run_machine_job(json.dumps(p).encode(),
                    executable=Path(os.environ['ENGINE_PATH']), timeout_seconds=90)
          assert len(result.payload) >= 100
          assert len(result.summary) == 2
          assert {x['format'] for x in result.summary} == {'pes','dst'}
          assert all(x['stitches'] > 10 and x['changes'] == 1 for x in result.summary)
          print('REAL JSON-TO-INKSTITCH JOB: PASSED, BOTH FORMATS, 1 COLOUR CHANGE')
          print('AUDITED MACHINE ZIP SHA256:',result.digest)
          print('PHYSICAL STITCH-OUT: NOT TESTED')
          PY
          echo 'ALL THREE ENGINE FIXTURES ARE STRUCTURAL ONLY: no physical embroidery stitch-out performed.'
      - name: Generate licensed rose source-to-native sewout evaluation pack
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rose-evaluation"
          xvfb-run -a -s "-screen 0 1280x800x24" python tools/run_artwork_trial.py \
            --image tests/fixtures/artwork-evaluation/rose.png \
            --engine "$ENGINE_PATH" --engine-timeout 120 --width-mm 80 \
            --output "$RUNNER_TEMP/rose-evaluation"
          python - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'rose-evaluation'
          report=json.loads((p/'machine-report.json').read_text())
          with zipfile.ZipFile(p/'ENGINEERING-TRIAL-NOT-APPROVED.zip') as z:
              assert z.testzip() is None
              assert any(n.endswith('.pes') for n in z.namelist())
              assert any(n.endswith('.dst') for n in z.namelist())
          for fmt in report['decoded']:
              if fmt['needlePointsOutsideWorkingColour'] or fmt['needleSegmentsOutsideWorkingColour']:
                  raise SystemExit('REFUSED: decoded source containment failed')
          assert not report['machineEligible']
          print('ROSE REAL SOURCE -> NATIVE PES/DST: independently decoded, NOT sewn')
          print('Unresolved source objects:',report['unresolvedObjects'])
          print('Blockers:',report['blockers'])
          PY
          cp tests/fixtures/artwork-evaluation/rose.png "$RUNNER_TEMP/rose-evaluation/original-rose-CC0.png"
          cat > "$RUNNER_TEMP/rose-evaluation/START-HERE-NOT-SEWOUT-VERIFIED.txt" <<'EOF'
          STITCH FORGE REAL NATIVE EMBROIDERY EVALUATION
          Source: CC0 Rose with leafs raster from the repo artwork fixtures.
          PES / DST output is REAL Ink/Stitch output, NOT a visual mock-up.
          NOT physically sewn. NOT approved for products or customer sale.
          Inspect machine-report.json for unresolved features, trims, density,
          colour assignments and limitations. Before a sewout, ask a machine
          operator to confirm machine format, hoop, size, thread chart,
          fabric, stabiliser and safe machine motion.
          EOF
      - name: Native MD-2.63 source-identical A/B routing gate on CC0 rose
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" python tools/bench_native_detail_routing_ab.py \
            --plan "$RUNNER_TEMP/rose-evaluation/source-object-plan.json" \
            --engine "$ENGINE_PATH" \
            --out "$RUNNER_TEMP/rose-evaluation/routing-ab"
          cat "$RUNNER_TEMP/rose-evaluation/routing-ab/native-ab-results.json"
      - name: Retain trial native files for a human sewout tester
        uses: actions/upload-artifact@v4
        with:
          name: stitch-forge-rose-native-sewout-EVALUATION-NOT-APPROVED
          path: ${{ runner.temp }}/rose-evaluation/
          if-no-files-found: error
          retention-days: 7
      - name: Build isolated staging container and prove real HTTP transaction
        shell: bash
        env:
          STITCH_FORGE_WORKER_TOKEN: synthetic-ci-only-token-never-use-in-hosting
        run: |
          set -euo pipefail
          docker build -f services/digitiser/Dockerfile -t stitch-forge-worker:test .
          docker run -d --name stitch-worker --read-only --tmpfs /tmp:rw,size=256m,mode=1777 \
            --memory 2g --cpus 2 --pids-limit 128 --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 \
            -e STITCH_FORGE_WORKER_TOKEN stitch-forge-worker:test
          trap 'docker inspect --format "{{json .State}}" stitch-worker; docker logs stitch-worker; docker rm -f stitch-worker' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8080/v1/digitise; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          for fixture in tests/fixtures/synthetic_*.json; do
            python services/digitiser/http_smoke.py --project "$fixture"
          done
