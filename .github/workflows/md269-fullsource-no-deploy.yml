name: MD-2.69 full-original-PNG directional evidence (NO DEPLOY)
on:
  push:
    branches: [feature/md269-fullsource-feature-gates-no-deploy]
    paths:
      - "services/digitiser/full_source_flow.py"
      - "tests/test_full_source_flow.py"
      - ".github/workflows/md269-fullsource-no-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-original-source-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use existing private-worker image processing dependencies
        run: python -m pip install -r services/digitiser/requirements-artwork-trial.txt
      - name: Test source identity, physically scaled texture and negative controls
        run: |
          python -m compileall -q services/digitiser/full_source_flow.py
          python -m unittest discover -s tests -p test_full_source_flow.py -v
      - name: Verify no deployment or machine claims
        run: |
          echo "Offline original-source geometry only."
          echo "No Netlify deployment, no Cloud Run build, no owner image upload."
          echo "No machine files generated or approved."
