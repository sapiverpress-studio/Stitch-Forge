name: MD-2.70 full-original-PNG packet contract (NO DEPLOY)
on:
  push:
    branches: [feature/md270-original-png-packet-no-deploy]
    paths:
      - ".github/workflows/md270-original-png-no-deploy.yml"
      - "services/digitiser/original_png_contract.py"
      - "services/digitiser/artwork_packet.py"
      - "site/artwork-pipeline.js"
      - "site/auto-reconstruct-ui.js"
      - "netlify/functions/lib/artwork-jobs.mjs"
      - "netlify/functions/artwork-embroidery.mjs"
      - "tests/test_original_png_transport.py"
      - "tests/test_original_png_transport.cjs"
      - "tools/verify_live_home_hybrid.py"
      - "tools/bench_md270_highres.py"
      - "services/digitiser/home_live_bridge.py"
      - "services/digitiser/source_palette_refit.py"
      - "tests/test_source_palette_refit.py"
      - "netlify/functions/artwork-job-submit.mjs"
      - "tests/test_background_artwork_jobs.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-original-source-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Node and Python dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          python -m pip install -r services/digitiser/requirements-artwork-trial.txt
      - name: Test original JPEG/PNG browser script syntax, SHA identity and envelope
        run: |
          node --check site/artwork-pipeline.js
          node --check site/auto-reconstruct-ui.js
          node --check netlify/functions/artwork-embroidery.mjs
          node --test tests/test_original_png_transport.cjs
          node --test tests/test_artwork_pipeline.cjs
          node --test tests/test_background_artwork_jobs.mjs
          node --test tests/test_artwork_endpoint.mjs
      - name: Test original PNG image correspondence and existing worker packet compatibility
        run: |
          python -m compileall -q services/digitiser/original_png_contract.py services/digitiser/artwork_packet.py
          python -m unittest discover -s tests -p test_original_png_transport.py -v
          python -m unittest discover -s tests -p test_source_palette_refit.py -v
          python -m unittest discover -s tests -p test_home_live_bridge.py -v
      - name: Install SHA-verified Ink/Stitch 3.3.0 for genuine PES/DST V2 acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape libnsl2 libwayland-server0 xvfb xauth
          python services/digitiser/install_engine.py "$RUNNER_TEMP/inkstitch"
      - name: Run source-identical V2 coarse versus full-resolution native PES/DST A/B
        run: |
          set -euo pipefail
          ENGINE="$(cat "$RUNNER_TEMP/inkstitch/engine-path")"
          for fixture in macaw rose; do
            mkdir -p "$RUNNER_TEMP/md270-$fixture"
            xvfb-run -a python tools/bench_md270_highres.py \
              --engine "$ENGINE" --fixture "$fixture" \
              --output "$RUNNER_TEMP/md270-$fixture"
            test -s "$RUNNER_TEMP/md270-$fixture/md270-highres-native-ab-NOT-APPROVED.json"
          done
      - name: Publish source-bound native audit summaries only (NO ORIGINAL PNGS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: md270-original-png-highres-AB-REPORTS-ONLY
          path: |
            ${{ runner.temp }}/md270-*/md270-highres-native-ab-NOT-APPROVED.json
            ${{ runner.temp }}/md270-*/*/md267-worker-native-verification.json
            ${{ runner.temp }}/md270-*/*/md267-machine-report-NOT-APPROVED.json
          if-no-files-found: ignore
          retention-days: 3
      - name: No customer output or deployment
        run: |
          echo "Contract tests only; no source or private user art in artifacts."
          echo "NO Netlify deploy, NO Cloud Build, NO worker traffic changes."
