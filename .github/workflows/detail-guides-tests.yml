name: Experimental internal detail guide tests

on:
  pull_request:
    paths:
      - "services/digitiser/detail_guides.py"
      - "services/digitiser/requirements-detail.txt"
      - "tests/test_detail_guides.py"
      - ".github/workflows/detail-guides-tests.yml"
      - "STITCH_FORGE_MASTER_DEVELOPMENT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned optional analysis dependencies
        run: python -m pip install -r services/digitiser/requirements-detail.txt
      - name: Synthetic-only contour tests (no customer artwork uploaded)
        run: python -m unittest discover -s tests -p 'test_detail_guides.py' -v
