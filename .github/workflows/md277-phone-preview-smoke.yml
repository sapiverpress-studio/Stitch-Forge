name: MD-2.77 phone smoke on actual Netlify preview (NO DEPLOY)
on:
  push:
    branches: ["feature/md277-automatic-simple-motifs-no-deploy"]
    paths:
      - ".github/workflows/md277-phone-preview-smoke.yml"
      - "tools/smoke_md277_mobile_preview.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-mobile-no-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tested headless phone browser
        run: |
          python -m pip install Pillow==12.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify hosted preview upload, default auto-mode, unpaid/no-token safety
        run: python tools/smoke_md277_mobile_preview.py
