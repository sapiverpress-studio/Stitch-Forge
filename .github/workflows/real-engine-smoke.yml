name: Real Ink-Stitch engine smoke (structural only)

on:
  pull_request:
    paths:
      - "services/digitiser/**"
      - "tests/**"
      - ".github/workflows/real-engine-smoke.yml"
      - "STITCH_FORGE_MASTER_DEVELOPMENT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inkstitch-pyembroidery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent file reader and Inkscape
        run: |
          python -m pip install pyembroidery==1.5.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape libnsl2
      - name: Resolve official pinned Ink-Stitch release archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 "https://api.github.com/repos/inkstitch/inkstitch/releases/tags/v3.3.0" > "$RUNNER_TEMP/inkstitch-release.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path(os.environ['RUNNER_TEMP'], 'inkstitch-release.json').read_text())
          if release.get('tag_name') != 'v3.3.0':
              raise SystemExit('Unexpected Ink/Stitch release tag')
          assets = [a for a in release.get('assets', [])
                    if a.get('name','').endswith('.tar.xz')
                    and 'linux' in a.get('name','').lower()
                    and ('x86_64' in a.get('name','').lower() or 'amd64' in a.get('name','').lower())]
          if len(assets) != 1:
              raise SystemExit('Expected exactly one Linux x86_64 tar.xz for v3.3.0; got: ' + str([a.get('name') for a in assets]))
          Path(os.environ['RUNNER_TEMP'], 'asset-url').write_text(assets[0]['browser_download_url'])
          print('Pinned upstream asset:', assets[0]['name'])
          PY
      - name: Download and unpack pinned Linux engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 360 "$(cat "$RUNNER_TEMP/asset-url")" -o "$RUNNER_TEMP/inkstitch.tar.xz"
          sha256sum "$RUNNER_TEMP/inkstitch.tar.xz"
          mkdir -p "$RUNNER_TEMP/inkstitch-unpacked"
          python - <<'PY'
          import os, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root/'inkstitch.tar.xz', 'r:xz') as tf:
              entries=tf.getmembers()
              if len(entries) > 20000:
                  raise SystemExit('Unexpectedly large archive member count')
              for entry in entries:
                  p=Path(entry.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe release archive path')
          PY
          tar --no-same-owner -xJf "$RUNNER_TEMP/inkstitch.tar.xz" -C "$RUNNER_TEMP/inkstitch-unpacked"
          find "$RUNNER_TEMP/inkstitch-unpacked" -name inkstitch -type f -perm /111 -print > "$RUNNER_TEMP/inkstitch-executables"
          test "$(wc -l < "$RUNNER_TEMP/inkstitch-executables")" -eq 1
          echo "ENGINE_PATH=$(cat "$RUNNER_TEMP/inkstitch-executables")" >> "$GITHUB_ENV"
      - name: Run actual engine and independent format audit
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python services/digitiser/real_engine_smoke.py --inkstitch "$ENGINE_PATH" --output "$RUNNER_TEMP/engine-smoke.zip"
          unzip -t "$RUNNER_TEMP/engine-smoke.zip"
          echo "No physical fabric stitch-out was performed."
