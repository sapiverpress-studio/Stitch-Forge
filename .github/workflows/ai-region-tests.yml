name: AI region proposal safety checks

on:
  pull_request:
    paths:
      - "netlify/functions/analyse-embroidery.mjs"
      - "site/ai-details.js"
      - "site/index.html"
      - "tests/test_ai_analysis.mjs"
      - ".github/workflows/ai-region-tests.yml"
      - "STITCH_FORGE_MASTER_DEVELOPMENT.md"
  push:
    branches: ["develop/stitch-engine-foundation"]
    paths:
      - "netlify/functions/analyse-embroidery.mjs"
      - "site/ai-details.js"
      - "site/index.html"
      - "tests/test_ai_analysis.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check (no OpenAI requests)
        run: |
          node --check netlify/functions/analyse-embroidery.mjs
          node --check site/ai-details.js
      - name: Verify proposals and authentication with synthetic fixtures
        run: node --test tests/test_ai_analysis.mjs
