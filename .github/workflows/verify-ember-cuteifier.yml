name: Verify Simplifier PNG
on:
  push:
    branches:
      - main
      - fix/restore-capaybara-simplifier-png-20261110
    paths:
      - 'site/cuteifier*'
      - 'site/detailed-motif.js'
      - 'site/simplifier-outline.js'
      - 'tests/test_simplifier_outline.cjs'
      - 'tests/test_cuteifier_complex_png.cjs'
      - 'tools/check_cuteifier_mobile.mjs'
      - '.github/workflows/verify-ember-cuteifier.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JS and page script paths
        run: node tools/check_frontend_syntax.cjs
      - name: Run full repository tests
        run: node --test tests/*.cjs tests/*.mjs
      - name: Install Chromium test browser
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Test mobile image simplification and downloaded PNG
        run: node tools/check_cuteifier_mobile.mjs
