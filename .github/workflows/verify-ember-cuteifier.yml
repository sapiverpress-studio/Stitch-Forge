name: Verify Ember Cuteifier PNG
on:
  push:
    branches:
      - feature/cuteifier-ember-png-20261110
      - 'fix/cuteifier-*'
      - feature/ai-cuteifier-redraw-20261110
      - main
    paths:
      - "site/cuteifier*"
      - "site/ember-prep-core.js"
      - "site/detailed-motif.js"
      - "tests/test_ember_prep.cjs"
      - "tests/test_cuteifier_complex_png.cjs"
      - "tests/test_cuteifier_ai.mjs"
      - "netlify/functions/cuteifier-*.mjs"
      - "netlify/functions/lib/cuteifier-jobs.mjs"
      - ".github/workflows/verify-ember-cuteifier.yml"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Netlify packages
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate all client scripts
        run: node tools/check_frontend_syntax.cjs
      - name: Test all Stitch Forge routes and PNG processing
        run: node --test tests/*.cjs tests/*.mjs
