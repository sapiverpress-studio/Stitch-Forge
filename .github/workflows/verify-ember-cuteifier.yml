name: Verify Capybara-Quality Cuteifier
on:
  push:
    branches:
      - main
      - feature/capabara-quality-cuteifier-20261110
    paths:
      - "site/cuteifier*"
      - "site/simplifier-outline.js"
      - "netlify/functions/cuteifier-*.mjs"
      - "netlify/functions/lib/cuteifier-jobs.mjs"
      - "tests/test_cuteifier_ai.mjs"
      - "tools/check_cuteifier_mobile.mjs"
      - ".github/workflows/verify-ember-cuteifier.yml"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check frontend source syntax
        run: node tools/check_frontend_syntax.cjs
      - name: Run complete repository tests
        run: node --test tests/*.cjs tests/*.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Verify mobile image upload, private response and both PNG downloads
        run: node tools/check_cuteifier_mobile.mjs
