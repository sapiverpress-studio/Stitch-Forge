name: Test unmodified StitchFoundry headless PNG to PES DST (NO DEPLOY)
on:
  push:
    branches: [experiment/stitchfoundry-upstream-headless-20261105-no-deploy]
    paths:
      - ".github/workflows/stitchfoundry-existing-engine-no-deploy.yml"
      - "tools/benchmark_upstream_stitchfoundry.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-release-cc0-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official StitchFoundry prebuilt archive and verify release SHA
        run: |
          set -euo pipefail
          URL=https://github.com/Stitchwright/StitchFoundry/releases/download/v0.14.0-rc.1/stitchfoundry-0.14.0-rc.1-linux-x86_64.tar.gz
          curl --fail --location --retry 3 --max-time 180 "$URL" -o "$RUNNER_TEMP/stitchfoundry-upstream.tar.gz"
          echo "a8f08d4d2c7b8752f2f1a13a34d06f1416597dbef49718eaca938ed8214d6cab  $RUNNER_TEMP/stitchfoundry-upstream.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stitchfoundry-upstream"
          tar -xzf "$RUNNER_TEMP/stitchfoundry-upstream.tar.gz" -C "$RUNNER_TEMP/stitchfoundry-upstream"
          CLI="$(find "$RUNNER_TEMP/stitchfoundry-upstream" -type f -name 'stitchfoundry-cli' | head -1)"
          if [ -z "$CLI" ]; then
            echo "No headless CLI in published binary; listing released executables" >&2
            find "$RUNNER_TEMP/stitchfoundry-upstream" -maxdepth 4 -type f | head -60 >&2
            exit 1
          fi
          chmod +x "$CLI"
          echo "$CLI" > "$RUNNER_TEMP/stitchfoundry-cli-path"
          "$CLI" --help | head -45
      - name: Prepare independent machine decoder
        run: python -m pip install 'Pillow==12.3.0' 'pyembroidery==1.5.1'
      - name: Run untouched upstream digitizer on SHA-verified CC0 images
        run: |
          set -euo pipefail
          CLI="$(cat "$RUNNER_TEMP/stitchfoundry-cli-path")"
          python tools/benchmark_upstream_stitchfoundry.py "$CLI" "$RUNNER_TEMP/stitchfoundry-CC0"
          test -s "$RUNNER_TEMP/stitchfoundry-CC0/STITCHFOUNDRY-CC0-REPORT.json"
      - name: Preserve CC0-only native results and native audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitchfoundry-v0.14.0-CC0-PES-DST-NOT-APPROVED
          path: |
            ${{ runner.temp }}/stitchfoundry-CC0/STITCHFOUNDRY-CC0-REPORT.json
            ${{ runner.temp }}/stitchfoundry-CC0/*NOT-APPROVED.pes
            ${{ runner.temp }}/stitchfoundry-CC0/*NOT-APPROVED.dst
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve verified upstream release for PRIVATE offline Kingfisher test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stitchfoundry-v0.14.0-original-signed-release-offline
          path: ${{ runner.temp }}/stitchfoundry-upstream.tar.gz
          retention-days: 2
          if-no-files-found: error
      - name: Verify no production action
        run: |
          echo 'No Cloud Run, Netlify, source merge or Work credits.'
          echo 'Upstream external binary release was tested unchanged on CC0 images.'
