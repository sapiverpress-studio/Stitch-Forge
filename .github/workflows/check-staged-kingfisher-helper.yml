name: Verify staged kingfisher helper syntax

on:
  push:
    branches:
      - feature/researched-infill-consolidation-md255
    paths:
      - tools/staged_md255_kingfisher.py
      - .github/workflows/check-staged-kingfisher-helper.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate standalone Cloud Shell script syntax
        run: python -m py_compile tools/staged_md255_kingfisher.py
