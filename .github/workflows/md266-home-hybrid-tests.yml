name: MD-2.66 offline Home hybrid candidate regression
on:
  push:
    branches:
      - feature/md266-home-hybrid-segmentation-no-deploy
    paths:
      - "services/digitiser/hybrid_home.py"
      - "tests/test_home_hybrid.py"
      - ".github/workflows/md266-home-hybrid-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned existing source-analysis dependencies
        run: python -m pip install -r services/digitiser/requirements-artwork-trial.txt
      - name: Verify isolated analysis compiles
        run: python -m py_compile services/digitiser/hybrid_home.py
      - name: Test source preservation, determinism and approval barriers
        run: python -m unittest discover -s tests -p test_home_hybrid.py -v
      - name: Confirm CI neither deploys nor generates production output
        run: |
          echo "Isolated colour-shape reconstruction only. No Cloud Build, no Netlify deployment."
          test -f services/digitiser/hybrid_home.py
          ! grep -q 'gcloud run deploy' services/digitiser/hybrid_home.py
