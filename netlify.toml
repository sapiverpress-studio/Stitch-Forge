"$schema" = "https://open-api.netlify.com/netlify.schema.json"
# Experimental static editor + protected AI Function. No Ink/Stitch runtime.
# Build fails closed if zero-cost mocked AI security/error tests fail.
# Experimental machine files are not approved for retail or machine use.
[build]
  publish = "site"
  command = "node tools/check_frontend_syntax.cjs && node --test tests/*.cjs tests/*.mjs && npm run build:lettering && npm run build:design-editor"

[build.environment]
  NODE_VERSION = "24"

[functions.design-editor]
  node_bundler = "esbuild"
  included_files = ["site/design-editor/motif-history/*.pes"]

[[redirects]]
  from = "/fine-detail"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cache-Control = "no-store"
