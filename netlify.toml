# Experimental static editor + protected AI Function. No Ink/Stitch runtime.
# Build fails closed if zero-cost mocked AI security/error tests fail.
# Experimental machine files are not approved for retail or machine use.
[build]
  publish = "site"
  command = "node --check site/fill-geometry.js && node --check site/fill-boundary-ui.js && node --test tests/test_ai_analysis.mjs tests/test_ai_guides.cjs tests/test_travel_routing.cjs tests/test_fill_geometry.cjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cache-Control = "no-store"
